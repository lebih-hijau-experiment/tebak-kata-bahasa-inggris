<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;touch-action:manipulation}
body{font-family:"Trebuchet MS","Comic Sans MS",system-ui,sans-serif;background:linear-gradient(#bfe8a3,#7cc576);color:#2b3a1f;font-size:17px}
#app{max-width:480px;margin:0 auto;padding:12px;min-height:100vh}
h1,h2{margin:6px 0;text-align:center}
.card{background:#fff;border-radius:20px;padding:14px;margin:10px 0;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.btn{display:block;width:100%;min-height:56px;border:0;border-radius:16px;background:#ff9f1c;color:#fff;font:inherit;font-weight:bold;font-size:19px;padding:10px;margin:8px 0;box-shadow:0 4px 0 #c97a00}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #c97a00}
.btn.g{background:#3aa655;box-shadow:0 4px 0 #26793b}.btn.s{background:#8a9a7b;box-shadow:0 4px 0 #66745a;font-size:16px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.zone{background:#fff;border:0;border-radius:18px;padding:10px 6px;font:inherit;text-align:center;box-shadow:0 4px 0 rgba(0,0,0,.15);min-height:112px}
.zone:active{transform:translateY(3px)}
.zone .e{font-size:34px}.zone b{display:block;font-size:15px}.zone small{display:block;color:#666}
.lv1{color:#2e9b4a}.lv2{color:#e08a00}.lv3{color:#d1392b}
.stars{color:#f5b301;font-size:18px;letter-spacing:2px}
.av{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.av button{font-size:30px;border:3px solid transparent;border-radius:14px;background:#f1f6ea;width:54px;height:54px}
.av button.on{border-color:#ff9f1c;background:#fff1d6}
input,select{width:100%;font:inherit;font-size:20px;padding:12px;border-radius:14px;border:3px solid #cfe3bf;margin:6px 0}
.pill{background:#fff;border-radius:999px;padding:4px 12px;font-weight:bold}
.bar{height:14px;background:#e3ecd9;border-radius:9px;overflow:hidden;flex:1}
.bar i{display:block;height:100%;width:100%;background:#3aa655;transition:width .1s linear,background .3s}
.mascot{font-size:64px;text-align:center;line-height:1.1}
.hop{animation:hop .6s}.shake{animation:shake .5s}
@keyframes hop{30%{transform:translateY(-22px)}60%{transform:translateY(0)}80%{transform:translateY(-8px)}}
@keyframes shake{25%{transform:translateX(-10px)}50%{transform:translateX(10px)}75%{transform:translateX(-6px)}}
.lbl{color:#6a7a5a;font-size:15px;text-align:center}
.sent{font-size:23px;font-weight:bold;text-align:center;margin:8px 0;line-height:1.35}.sent.big{font-size:30px}
.sent u{text-decoration-thickness:4px;text-decoration-color:#ff9f1c;text-underline-offset:4px;color:#d96b00}
.spk{display:block;margin:4px auto;font-size:26px;border:0;background:#eaf5de;border-radius:50%;width:48px;height:48px}
.opt{display:block;width:100%;min-height:58px;margin:8px 0;border:3px solid #cfe3bf;background:#fff;border-radius:16px;font:inherit;font-size:19px;font-weight:bold;padding:8px 12px;box-shadow:0 4px 0 rgba(0,0,0,.1)}
.opt.ok{background:#c9f0cf;border-color:#3aa655}.opt.no{background:#ffd5d0;border-color:#e0493a}
.cd{font-size:120px;text-align:center;font-weight:bold;color:#fff;text-shadow:0 4px 0 #26793b;margin-top:25vh}
.fb{text-align:center}.fb .w{font-size:28px;font-weight:bold}.fb .tr{color:#555;font-size:16px}
table{width:100%;border-collapse:collapse}td{padding:8px 4px;border-bottom:1px solid #eee}
.miss{font-size:16px;text-align:left}
</style>
</head>

<script>
'use strict';
/* ==========================================================================
   SAFARI KATA — logika game
   Daftar isi:
     1. PENGATURAN   : semua angka/aturan game (ubah di sini)
     2. DATA         : memuat & memeriksa JSON dari <script id="game-data">
     3. PENYIMPANAN  : profil & skor di localStorage
     4. UTILITAS     : fungsi bantu kecil
     5. LAYAR        : profil, peta, leaderboard
     6. RONDE        : soal, timer, skor, hasil
     7. EVENT        : daftar aksi tombol (ACTIONS) & penghubung klik
     8. MULAI
   ========================================================================== */


/* ============================== 1. PENGATURAN ============================== */
const CONFIG = {
  storageKey: 'safariKataV2',

  // Timer
  secondsPerQuestion: 15,
  secondsPerWordInRound: 10,      // timer ronde = jumlah soal × angka ini

  // Nyawa
  startingLives: 3,
  streakForExtraLife: 5,          // tiap kelipatan ini, +1 nyawa (maks. startingLives)

  // Skor
  baseScore: 100,
  maxSpeedBonus: 50,              // bonus kecepatan: 0..ini, sebanding sisa waktu soal
  streakBonus: { 3: 20, 4: 30, 5: 50 },   // 5 ke atas memakai nilai terakhir
  lifeBonusPerLife: 50,           // bonus akhir ronde per nyawa tersisa
  starThresholds: [0.6, 0.8, 1.0],        // proporsi benar untuk ★, ★★, ★★★

  leaderboardSize: 10,
  resetHoldMs: 3000,              // lama menahan tombol "Hapus semua data"
  levelLabels: { 1: 'Mudah', 2: 'Sedang', 3: 'Sulit' },
  avatars: ['🐘', '🦒', '🐒', '🦁', '🐧', '🐯', '🦓', '🐼', '🦉', '🐸'],

  // Mode "Safari Acak" (zona khusus dengan id 0)
  random: { name: 'Safari Acak', emoji: '🎲', mascot: '🦜', wordCount: 10, choices: 4, reverseChance: 0.3 },
};
const RANDOM_ZONE_ID = 0;
const TICK_SECONDS = 0.1;


/* ================================ 2. DATA ================================== */
let ZONES = [];
let WORDS = [];

/** Membaca JSON & memeriksa kesalahan umum, agar salah ketik mudah ditemukan. */
function loadGameData() {
  const data = JSON.parse(document.getElementById('game-data').textContent);
  ZONES = data.zones;
  WORDS = data.words;

  const problems = [];
  const requiredWordFields = ['english', 'indonesian', 'sentence', 'translation', 'emoji', 'zone'];
  WORDS.forEach((w, i) => {
    requiredWordFields.forEach(f => {
      if (w[f] === undefined || w[f] === '') problems.push(`Kata #${i + 1} (${w.english || '?'}): field "${f}" kosong`);
    });
    if (!ZONES.some(z => z.id === w.zone)) problems.push(`Kata "${w.english}": zone ${w.zone} tidak ditemukan`);
    if (w.sentence && !/\[.+\]/.test(w.sentence)) problems.push(`Kata "${w.english}": kalimat harus punya tanda [kata]`);
  });
  if (problems.length) throw new Error(problems.join('\n'));
}

function getZone(id) {
  if (id === RANDOM_ZONE_ID) return { id, ...CONFIG.random };
  const zone = ZONES.find(z => z.id === id);
  return { mascot: '🦁', choices: 3, reverseChance: 0, ...zone };   // nilai bawaan jika tidak diisi di JSON
}
const wordsInZone = id => WORDS.filter(w => w.zone === id);


/* ============================= 3. PENYIMPANAN ============================== */
/* db.best[profileId][zoneId] = { score, stars } */
const db = loadDb();

function loadDb() {
  const empty = { profiles: [], current: null, best: {} };
  try { return Object.assign(empty, JSON.parse(localStorage.getItem(CONFIG.storageKey) || '{}')); }
  catch (e) { return empty; }
}
function saveDb() {
  try { localStorage.setItem(CONFIG.storageKey, JSON.stringify(db)); } catch (e) { /* abaikan */ }
}
function resetDb() {
  db.profiles = []; db.current = null; db.best = {};
  saveDb();
}
const currentProfile = () => db.profiles.find(p => p.id === db.current);


/* =============================== 4. UTILITAS =============================== */
const app = document.getElementById('app');
const $ = id => document.getElementById(id);
const show = html => { app.innerHTML = html; };

const ESCAPES = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' };
const escapeHtml = s => String(s).replace(/[&<>"]/g, c => ESCAPES[c]);

/** "Find the [missing] number" -> kata di dalam [ ] digarisbawahi. */
const underline = sentence => escapeHtml(sentence).replace(/\[(.+?)\]/g, '<u>$1</u>');
const stripBrackets = sentence => sentence.replace(/[\[\]]/g, '');

const renderStars = (n, max = 3) => '★'.repeat(n) + '☆'.repeat(max - n);

function shuffle(list) {
  for (let i = list.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [list[i], list[j]] = [list[j], list[i]];
  }
  return list;
}

/** Kata-kata penting dari sebuah arti, untuk mencegah pilihan yang artinya mirip. */
const IGNORED_TOKENS = ['yang', 'sama', 'dari', 'dibaca'];
const meaningTokens = text =>
  text.toLowerCase().split(/[^a-z]+/).filter(t => t.length > 3 && !IGNORED_TOKENS.includes(t));

const canSpeak = 'speechSynthesis' in window;
function speak(text) {
  try {
    speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'en-US';
    utterance.rate = 0.85;
    speechSynthesis.speak(utterance);
  } catch (e) { /* abaikan */ }
}
const speakButton = action => canSpeak ? `<button class="spk" data-action="${action}">🔊</button>` : '';


/* ================================ 5. LAYAR ================================= */
let chosenAvatar = CONFIG.avatars[0];

/* ---------- Pilih / buat pemain ---------- */
function showProfileScreen() {
  game = null;
  const typedName = ($('name-input') || {}).value || '';   // pertahankan ketikan saat layar digambar ulang
  show(`
    <h1>🦁 Safari Kata</h1>
    <div class="lbl">Siapa yang main hari ini?</div>
    ${db.profiles.map(p => `<button class="btn g" data-action="chooseProfile" data-arg="${p.id}">${p.avatar} ${escapeHtml(p.name)}</button>`).join('')}
    <div class="card"><b>Pemain baru</b>
      <input id="name-input" maxlength="12" placeholder="Nama panggilan" autocomplete="off">
      <div class="av">${CONFIG.avatars.map(a => `<button class="${a === chosenAvatar ? 'on' : ''}" data-action="chooseAvatar" data-arg="${a}">${a}</button>`).join('')}</div>
      <button class="btn" data-action="createProfile">Mulai! ▶</button>
    </div>
    <button class="btn s" data-hold="wipe">Hapus semua data (tahan 3 detik)</button>`);
  $('name-input').value = typedName;
}

function createProfile() {
  const input = $('name-input');
  const name = input.value.trim();
  if (!name) { input.focus(); return; }
  const profile = { id: Date.now().toString(36), name, avatar: chosenAvatar };
  db.profiles.push(profile);
  db.current = profile.id;
  saveDb();
  showMapScreen();
}

/* ---------- Peta zona ---------- */
function zoneCard(zone, best) {
  const stars = best[zone.id] ? best[zone.id].stars : 0;
  return `<button class="zone" data-action="playZone" data-arg="${zone.id}">
      <span class="e">${zone.emoji}</span>
      <b>${zone.id}. ${escapeHtml(zone.name)}</b>
      <small class="lv${zone.level}">${CONFIG.levelLabels[zone.level]} · ${wordsInZone(zone.id).length} kata</small>
      <span class="stars">${renderStars(stars)}</span>
    </button>`;
}

function showMapScreen() {
  const profile = currentProfile();
  if (!profile) return showProfileScreen();
  const best = db.best[profile.id] || {};
  show(`
    <div class="row">
      <span class="pill">${profile.avatar} ${escapeHtml(profile.name)}</span>
      <button class="pill" style="border:0;font:inherit" data-action="changePlayer">Ganti</button>
    </div>
    <h2>🗺️ Peta Safari</h2>
    <div class="lbl">Pilih zona yang kamu mau!</div>
    <div class="grid" style="margin-top:10px">${ZONES.map(z => zoneCard(z, best)).join('')}</div>
    <button class="btn" data-action="playZone" data-arg="${RANDOM_ZONE_ID}" style="margin-top:14px">${CONFIG.random.emoji} ${CONFIG.random.name} (${CONFIG.random.wordCount} kata campur)</button>
    <button class="btn g" data-action="showLeaderboard" data-arg="all">🏆 Leaderboard</button>`);
}

/* ---------- Leaderboard ---------- */
/** selection: 'all' (total semua zona) atau id zona (0 = Safari Acak). */
function leaderboardRows(selection) {
  const rows = [];
  db.profiles.forEach(profile => {
    const best = db.best[profile.id] || {};
    if (selection === 'all') {
      const entries = ZONES.map(z => best[z.id]).filter(Boolean);
      const score = entries.reduce((sum, e) => sum + e.score, 0);
      const stars = entries.reduce((sum, e) => sum + e.stars, 0);
      if (score) rows.push({ profile, score, label: `⭐ ${stars}/${ZONES.length * 3}` });
    } else if (best[selection]) {
      rows.push({ profile, score: best[selection].score, label: renderStars(best[selection].stars) });
    }
  });
  return rows.sort((a, b) => b.score - a.score).slice(0, CONFIG.leaderboardSize);
}

function showLeaderboardScreen(selection) {
  const rows = leaderboardRows(selection);
  const option = (value, label) => `<option value="${value}"${selection === value ? ' selected' : ''}>${label}</option>`;
  const medal = i => ['🥇', '🥈', '🥉'][i] || i + 1;
  show(`
    <h2>🏆 Leaderboard</h2>
    <select data-change="showLeaderboard">
      ${option('all', `Keseluruhan (semua zona)`)}
      ${ZONES.map(z => option(z.id, `${z.id}. ${escapeHtml(z.name)}`)).join('')}
      ${option(RANDOM_ZONE_ID, `${CONFIG.random.emoji} ${CONFIG.random.name}`)}
    </select>
    <div class="card">${rows.length
      ? `<table>${rows.map((r, i) => `<tr>
          <td>${medal(i)}</td><td style="font-size:26px">${r.profile.avatar}</td>
          <td><b>${escapeHtml(r.profile.name)}</b></td>
          <td style="text-align:right"><b>${r.score}</b><br><span class="stars" style="font-size:14px">${r.label}</span></td></tr>`).join('')}</table>`
      : '<div class="lbl">Belum ada skor. Yuk main dulu!</div>'}</div>
    <button class="btn g" data-action="showMap">🗺️ Kembali ke Peta</button>`);
}


/* ================================ 6. RONDE ================================= */
let game = null;   // status ronde yang sedang berjalan (null jika tidak sedang main)

/* ---------- Membuat soal ---------- */
function buildQuestions(zone) {
  const pool = zone.id === RANDOM_ZONE_ID
    ? shuffle(WORDS.slice()).slice(0, zone.wordCount)
    : wordsInZone(zone.id);
  return shuffle(pool.slice()).map(word => ({
    word,
    reversed: Math.random() < zone.reverseChance,     // true: Indonesia -> Inggris
    options: buildOptions(word, zone.choices),
  }));
}

/** 1 jawaban benar + pengecoh (diutamakan dari zona yang sama, artinya tidak boleh mirip). */
function buildOptions(word, count) {
  const tooSimilar = other =>
    other === word || meaningTokens(other.indonesian).some(t => meaningTokens(word.indonesian).includes(t));
  const decoys = shuffle(WORDS.filter(w => w.zone === word.zone && !tooSimilar(w)))
    .concat(shuffle(WORDS.filter(w => w.zone !== word.zone && !tooSimilar(w))));
  return shuffle([word, ...decoys.slice(0, count - 1)]);
}

/* ---------- Memulai ronde ---------- */
function startRound(zoneId) {
  const zone = getZone(zoneId);
  const questions = buildQuestions(zone);
  game = {
    zone, questions, index: 0,
    lives: CONFIG.startingLives, score: 0, streak: 0, correct: 0, missed: [],
    roundTimeLeft: questions.length * CONFIG.secondsPerWordInRound,
    running: false, answered: false, question: null, questionTimeLeft: 0,
  };
  runCountdown(game);
}

function runCountdown(thisGame) {
  let n = 3;
  (function step() {
    if (game !== thisGame) return;                  // ronde dibatalkan
    if (n === 0) return showQuestion();
    show(`<div class="cd">${n}</div><div class="mascot">${thisGame.zone.mascot}</div><h2 style="color:#fff">Siap-siap!</h2>`);
    n--;
    setTimeout(step, 800);
  })();
}

/* ---------- Tampilan soal ---------- */
const heartsText = () => '❤️'.repeat(game.lives) + '🖤'.repeat(CONFIG.startingLives - game.lives);

function hudHtml() {
  return `<div class="row">
      <span class="pill" id="hud-lives">${heartsText()}</span>
      <span class="pill">${game.index + 1}/${game.questions.length}</span>
      <span class="pill" id="hud-score">⭐ ${game.score}</span>
    </div>
    <div class="row" style="margin-top:8px"><small>Ronde</small><div class="bar"><i id="round-bar"></i></div><b id="round-time"></b></div>`;
}

function questionHtml(q) {
  return q.reversed
    ? `<div class="lbl">Apa bahasa Inggrisnya?</div><div class="sent big">${escapeHtml(q.word.indonesian)}</div>`
    : `<div class="lbl">Apa arti kata yang bergaris bawah?</div><div class="sent">${underline(q.word.sentence)}</div>${speakButton('speakQuestion')}`;
}

function showQuestion() {
  const q = game.questions[game.index];
  game.question = q;
  game.questionTimeLeft = CONFIG.secondsPerQuestion;
  game.answered = false;
  game.running = true;
  show(`${hudHtml()}
    <div class="mascot" id="mascot">${game.zone.mascot}</div>
    <div class="card">${questionHtml(q)}</div>
    <div class="row"><small>Soal</small><div class="bar"><i id="question-bar"></i></div><b id="question-time"></b></div>
    <div id="answer-area">${q.options.map((o, i) =>
      `<button class="opt" data-action="answer" data-arg="${i}">${escapeHtml(q.reversed ? o.english : o.indonesian)}</button>`).join('')}</div>`);
  updateTimerBars();
}

/* ---------- Timer ---------- */
function barColor(fraction) { return fraction > 0.5 ? '#3aa655' : fraction > 0.25 ? '#f5b301' : '#e0493a'; }

function paintBar(barId, textId, secondsLeft, totalSeconds) {
  const fraction = Math.max(0, secondsLeft / totalSeconds);
  $(barId).style.width = fraction * 100 + '%';
  $(barId).style.background = barColor(fraction);
  $(textId).textContent = Math.ceil(Math.max(0, secondsLeft)) + 's';
}

function updateTimerBars() {
  if (!$('round-bar')) return;
  paintBar('round-bar', 'round-time', game.roundTimeLeft, game.questions.length * CONFIG.secondsPerWordInRound);
  paintBar('question-bar', 'question-time', game.questionTimeLeft, CONFIG.secondsPerQuestion);
}

function onTick() {
  if (!game || !game.running) return;               // timer berhenti saat penjelasan tampil
  game.questionTimeLeft -= TICK_SECONDS;
  game.roundTimeLeft -= TICK_SECONDS;
  updateTimerBars();
  if (game.roundTimeLeft <= 0) { game.running = false; endRound('time'); }
  else if (game.questionTimeLeft <= 0) answerQuestion(-1);   // -1 = waktu habis
}

/* ---------- Menjawab ---------- */
const randomOf = list => list[Math.floor(Math.random() * list.length)];

function streakBonusFor(streak) {
  const levels = Object.keys(CONFIG.streakBonus).map(Number);
  const key = Math.min(streak, Math.max(...levels));
  return CONFIG.streakBonus[key] || 0;
}

/** Memperbarui skor/nyawa untuk jawaban benar; mengembalikan pesan untuk anak. */
function applyCorrectAnswer() {
  const speedBonus = Math.round(CONFIG.maxSpeedBonus * Math.max(0, game.questionTimeLeft) / CONFIG.secondsPerQuestion);
  game.streak++;
  game.correct++;
  const streakBonus = streakBonusFor(game.streak);
  const points = CONFIG.baseScore + speedBonus + streakBonus;
  game.score += points;

  let message = `${randomOf(['Hebat! 🎉', 'Pintar! 👏', 'Benar! 🌟'])} +${points}`;
  if (streakBonus) message += ` 🔥 Beruntun +${streakBonus}`;
  if (game.streak % CONFIG.streakForExtraLife === 0 && game.lives < CONFIG.startingLives) {
    game.lives++;
    message += ' ❤️ +1 nyawa!';
  }
  return message;
}

function applyWrongAnswer(timedOut) {
  game.streak = 0;
  game.lives--;
  game.missed.push(game.question.word);
  return timedOut ? 'Waktu habis! ⏰' : 'Hampir! Yuk lihat artinya 💪';
}

function answerQuestion(choiceIndex) {              // choiceIndex -1 = waktu habis
  if (!game || game.answered) return;
  game.answered = true;
  game.running = false;

  const q = game.question;
  const isCorrect = choiceIndex >= 0 && q.options[choiceIndex] === q.word;
  const message = isCorrect ? applyCorrectAnswer() : applyWrongAnswer(choiceIndex < 0);

  document.querySelectorAll('.opt').forEach((button, i) => {
    button.disabled = true;
    if (q.options[i] === q.word) button.classList.add('ok');
    else if (i === choiceIndex) button.classList.add('no');
  });
  $('mascot').classList.add(isCorrect ? 'hop' : 'shake');
  $('hud-lives').textContent = heartsText();
  $('hud-score').textContent = '⭐ ' + game.score;
  showExplanation(message, isCorrect);
}

function showExplanation(message, isCorrect) {
  const w = game.question.word;
  const isLast = game.lives <= 0 || game.index + 1 >= game.questions.length;
  $('answer-area').innerHTML = `
    <div class="card fb">
      <div style="font-weight:bold;font-size:20px;color:${isCorrect ? '#2e9b4a' : '#d1392b'}">${message}</div>
      <div class="w">${w.emoji} ${escapeHtml(w.english)} = ${escapeHtml(w.indonesian)}</div>
      <div class="sent" style="font-size:19px">${underline(w.sentence)}</div>
      <div class="tr">${escapeHtml(w.translation)}</div>
      ${speakButton('speakAnswer')}
    </div>
    <button class="btn g" data-action="nextQuestion">${isLast ? 'Selesai 🏁' : 'Lanjut ▶'}</button>`;
}

function nextQuestion() {
  if (game.lives <= 0) return endRound('lives');
  if (game.index + 1 >= game.questions.length) return endRound('done');
  game.index++;
  showQuestion();
}

/* ---------- Akhir ronde ---------- */
function starsFor(correct, total) {
  const ratio = correct / total;
  return CONFIG.starThresholds.filter(t => ratio >= t).length;
}

/** Menyimpan skor terbaik; mengembalikan true jika skor ini rekor baru. */
function saveBestScore(zoneId, score, stars) {
  const profileBest = db.best[currentProfile().id] = db.best[currentProfile().id] || {};
  const old = profileBest[zoneId];
  const isNewBest = !old || score > old.score;
  profileBest[zoneId] = { score: isNewBest ? score : old.score, stars: Math.max(stars, old ? old.stars : 0) };
  saveDb();
  return isNewBest;
}

const END_TITLES = {
  done: 'Ronde selesai! 🎉',
  lives: 'Yah, nyawa habis. Yuk coba lagi! 💪',
  time: 'Waktu ronde habis! ⏰',
};

function endRound(reason) {
  game.running = false;
  const g = game;
  const total = g.questions.length;
  const endBonus = Math.max(0, g.lives) * CONFIG.lifeBonusPerLife + Math.max(0, Math.floor(g.roundTimeLeft));
  g.score += endBonus;
  const stars = starsFor(g.correct, total);
  const isNewBest = saveBestScore(g.zone.id, g.score, stars);

  show(`
    <div class="mascot">${stars >= 2 ? '🥳' : '🤗'}</div>
    <h2>${END_TITLES[reason]}</h2>
    <div class="card" style="text-align:center">
      <div class="stars" style="font-size:42px">${renderStars(stars)}</div>
      <div style="font-size:34px;font-weight:bold">⭐ ${g.score}</div>
      ${isNewBest ? '<div style="color:#2e9b4a;font-weight:bold">🏅 Skor terbaikmu!</div>' : ''}
      <div class="lbl">Benar ${g.correct} dari ${total} · Bonus akhir +${endBonus}</div>
    </div>
    ${g.missed.length ? `<div class="card miss"><b>📝 Kata yang perlu diulang:</b>
      ${g.missed.map(w => `<div>${w.emoji} <b>${escapeHtml(w.english)}</b> = ${escapeHtml(w.indonesian)}</div>`).join('')}</div>` : ''}
    <button class="btn" data-action="playZone" data-arg="${g.zone.id}">🔁 Main lagi</button>
    <button class="btn g" data-action="showMap">🗺️ Peta Safari</button>
    <button class="btn s" data-action="showLeaderboard" data-arg="${g.zone.id}">🏆 Leaderboard</button>`);
  game = null;
}


/* ================================ 7. EVENT ================================= */
/* Tambah fitur baru: buat fungsinya, daftarkan di sini, lalu pakai
   data-action="namaAksi" (dan data-arg="nilai") pada tombol di HTML. */
const ACTIONS = {
  chooseProfile: id => { db.current = id; saveDb(); showMapScreen(); },
  createProfile,
  chooseAvatar: avatar => { chosenAvatar = avatar; showProfileScreen(); },
  changePlayer: showProfileScreen,
  playZone: id => startRound(Number(id)),
  answer: i => answerQuestion(Number(i)),
  nextQuestion,
  speakQuestion: () => speak(stripBrackets(game.question.word.sentence)),
  speakAnswer: () => speak(game.question.word.english + '. ' + stripBrackets(game.question.word.sentence)),
  showMap: showMapScreen,
  showLeaderboard: arg => showLeaderboardScreen(arg === 'all' ? 'all' : Number(arg)),
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (el && ACTIONS[el.dataset.action]) ACTIONS[el.dataset.action](el.dataset.arg, el);
});

document.addEventListener('change', e => {          // dropdown leaderboard
  const name = e.target.dataset.change;
  if (name && ACTIONS[name]) ACTIONS[name](e.target.value);
});

/* Tombol "Hapus semua data": harus ditahan beberapa detik */
let holdTimer = null;
document.addEventListener('pointerdown', e => {
  if (e.target.closest('[data-hold="wipe"]')) {
    holdTimer = setTimeout(() => { resetDb(); showProfileScreen(); }, CONFIG.resetHoldMs);
  }
});
['pointerup', 'pointerleave', 'pointercancel'].forEach(type =>
  document.addEventListener(type, () => clearTimeout(holdTimer), true));


/* ================================= 8. MULAI ================================ */
try {
  loadGameData();
  setInterval(onTick, TICK_SECONDS * 1000);
  currentProfile() ? showMapScreen() : showProfileScreen();
} catch (err) {
  show(`<div class="card"><h2>⚠️ Data game bermasalah</h2>
    <p>Periksa blok <code>game-data</code> (JSON) di file ini:</p>
    <pre style="white-space:pre-wrap;font-size:14px">${escapeHtml(err.message)}</pre></div>`);
}

</script>
</body>
</html>
